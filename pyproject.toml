[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "1.0.0"
description = "Fine-tune YOLOv8 for visual defect inspection and serve ONNX inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.17",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "ultralytics>=8.2,<9",
]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
    "ruff>=0.6",
    "onnx>=1.15",
]

[project.scripts]
visionguard = "visionguard.__main__:main"

[tool.setuptools.packages.find]
include = ["visionguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
